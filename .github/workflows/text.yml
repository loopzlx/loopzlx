name: test
on:
  push:
  pull_request:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install deps
        run: |
          npm install --no-audit --no-fund
          pip install playwright
          playwright install --with-deps chromium
      - name: Build (Tailwind CSS + version + service worker)
        run: npm run build:all
      - name: Generated files must be committed
        run: git diff --exit-code -- sw.js load.html html js/home/core
      - name: Regression suite
        run: bash tests/run.sh
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: screenshots, path: "${{ runner.temp }}/*.png", if-no-files-found: ignore }
