<style>
.lzx-skel { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; background: var(--bg-base, #050507); z-index: 9999; }
.lzx-skel-logo { font-family: Orbitron, sans-serif; font-size: clamp(28px,7vw,46px); letter-spacing: .22em; color: var(--text-main, #fff);
  text-shadow: 2px 0 var(--secondary, #ff69b4), -2px 0 var(--primary, #8a2be2); animation: lzxSkelPulse 1.6s ease-in-out infinite; }
.lzx-skel-sub { font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: .34em; color: var(--primary, #8a2be2); }
.lzx-skel-bar { width: min(240px, 60vw); height: 2px; background: color-mix(in srgb, var(--primary, #8a2be2) 22%, transparent); overflow: hidden; margin-top: 6px; }
.lzx-skel-bar i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, var(--primary, #8a2be2), var(--secondary, #ff69b4));
  animation: lzxSkelBar 1.1s ease-in-out infinite; }
.lzx-skel-hint { font-family: 'Share Tech Mono', monospace; font-size: 10px; letter-spacing: .2em; color: var(--text-muted, rgba(255,255,255,.4)); }
@keyframes lzxSkelPulse { 0%,100%{opacity:1} 50%{opacity:.6} }
@keyframes lzxSkelBar { 0%{transform:translateX(-100%)} 100%{transform:translateX(250%)} }
</style>
<body>
<div id="app"><div class="lzx-skel">
  <div class="lzx-skel-logo">LOOPZLX</div>
  <div class="lzx-skel-sub">CYBER NEXUS TERMINAL</div>
  <div class="lzx-skel-bar"><i></i></div>
  <div class="lzx-skel-hint">booting kernel…</div>
</div></div>
<script>
function showError(msg) {
    document.body.innerHTML = `
        <style>
            .err-body { margin: 0; padding: 0; background: #050505; color: #ff69b4; font-family: 'Share Tech Mono', monospace; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; position: relative; }
            .err-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(138,43,226,.15) 1px, transparent 1px), linear-gradient(90deg, rgba(138,43,226,.15) 1px, transparent 1px); background-size: 40px 40px; perspective: 500px; transform: rotateX(60deg) scale(2); z-index: 0; pointer-events: none; opacity: 0.5; }
            .err-container { position: relative; width: 90%; max-width: 550px; padding: 40px; background: rgba(20, 10, 30, 0.8); border: 1px solid #8a2be2; border-radius: 12px; backdrop-filter: blur(10px); box-shadow: 0 0 40px rgba(138,43,226,0.2); z-index: 10; text-align: center; }
            .err-title { font-family: 'Orbitron', sans-serif; font-size: 32px; font-weight: 900; color: #fff; text-shadow: 2px 0 #ff69b4, -2px 0 #8a2be2; animation: glitch 0.8s infinite alternate-reverse; margin-bottom: 20px; letter-spacing: 2px; }
            @keyframes glitch { 0% { transform: translate(0); } 20% { transform: translate(-2px, 2px); } 40% { transform: translate(-2px, -2px); } 60% { transform: translate(2px, 2px); } 80% { transform: translate(2px, -2px); } 100% { transform: translate(0); } }
            .err-terminal { background: #000; border-left: 3px solid #ff69b4; padding: 20px; text-align: left; margin: 20px 0; font-size: 13px; color: #e2e8f0; line-height: 1.6; box-shadow: inset 0 0 20px rgba(0,0,0,0.8); }
            .err-solution { color: #00ff41; margin-top: 20px; font-size: 12px; background: rgba(0,255,65,0.05); padding: 15px; border-radius: 8px; border: 1px dashed #00ff41; text-align: left; line-height: 1.8; }
            .err-solution code { background: #111; padding: 2px 6px; border-radius: 4px; color: #fff; }
            .err-scanline { position: absolute; inset: 0; background: linear-gradient(transparent 50%, rgba(0,0,0,0.3) 50%); background-size: 100% 4px; z-index: 20; pointer-events: none; opacity: 0.3; }
        </style>
        <div class="err-body">
            <div class="err-grid"></div>
            <div class="err-scanline"></div>
            <div class="err-container">
                <div class="err-title">KERNEL PANIC</div>
                <div class="err-terminal">
                    <span style="color:#8a2be2; font-weight:bold;">[SYS_LOG]</span> CRITICAL_FAILURE.<br>
                    <span style="color:#ff69b4; font-weight:bold;">[ERROR]</span> ${msg}
                </div>
                <div class="err-solution">
                    <strong style="color:#fff;">>> 修复指南 / HOW TO FIX:</strong><br>
                    1. 请勿直接双击打开 index.html (浏览器拦截了本地请求)。<br>
                    2. 请使用 VSCode 的 <b>Live Server</b> 插件运行。<br>
                    3. 检查你的文件路径是否存在：<code>html/home/home.html</code>
                </div>
            </div>
        </div>
    `;
    document.body.className = '';
}

fetch('html/home/home.html')
  .then(r => {
      if(!r.ok) throw new Error(`文件没找到！状态码: ${r.status}`);
      return r.text();
  })
  .then(html => {
      document.getElementById('app').innerHTML = html;
      
      const achScript = document.createElement('script');
      achScript.src = 'js/home/core/achievements.js?v=7.3.0';
      achScript.onerror = () => console.warn('[ach] 成就模块跳过');
      document.body.appendChild(achScript);

      const extrasScript = document.createElement('script');
      extrasScript.src = 'js/home/core/ui-extras.js?v=7.3.0';
      extrasScript.onerror = () => console.warn('[ui] 增强模块跳过');
      document.body.appendChild(extrasScript);

      const toolScript = document.createElement('script');
      toolScript.src = 'js/home/core/toolkit.js?v=7.3.0';
      toolScript.onerror = () => console.warn('[tool] 工具箱跳过');
      document.body.appendChild(toolScript);

      const audioScript = document.createElement('script');
      audioScript.src = 'js/home/core/audio-player.js?v=7.3.0';
      audioScript.onload = () => {
          const mainScript = document.createElement('script');
          mainScript.src = 'js/home/core/main.js?v=7.3.0';
          mainScript.onerror = () => showError('main.js 加载失败');
          mainScript.onload = () => {
              {
                  const osuScript = document.createElement('script');
                  osuScript.src = 'js/home/core/osu-loader.js?v=7.3.0';
                  osuScript.onerror = () => console.warn('[osu] loader 加载失败，音游模块跳过');
                  osuScript.onload = () => {
                      const ghScript = document.createElement('script');
                      ghScript.src = 'js/home/core/gamehub-loader.js?v=7.3.0';
                      ghScript.onerror = () => console.warn('[gamehub] loader 加载失败，游戏中心跳过');
                      ghScript.onload = () => {
                          const celScript = document.createElement('script');
                          celScript.src = 'js/home/core/celeste-loader.js?v=7.3.0';
                          celScript.onerror = () => console.warn('[celeste] loader 加载失败，蔚蓝模块跳过');
                          document.body.appendChild(celScript);
                      };
                      document.body.appendChild(ghScript);
                  };
                  document.body.appendChild(osuScript);
              }
          };
          document.body.appendChild(mainScript);
      };
      audioScript.onerror = () => showError('audio-player.js 加载失败');
      document.body.appendChild(audioScript);
  })
  .catch(err => {
      console.error(err);
      showError(err.message);
  });
</script>
</body>
</html>
