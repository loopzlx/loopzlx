<script>
/* 启动页先套用已保存的主题色：避免“先闪一版默认紫/绿，再跳到自己的主题” */
(function () {
    var MAP = {
        'theme-cyber': ['#050507', '#a78bfa', '#ff69b4', 'rgba(167,139,250,.07)'],
        'theme-hacker': ['#020202', '#00ff41', '#008f11', 'rgba(0,255,65,.07)'],
        'theme-sweet-pink': ['#1A1A1D', '#E6397C', '#ff8cb3', 'rgba(230,57,124,.07)'],
        'theme-sunset': ['#1a0b0b', '#ff6b35', '#f7c548', 'rgba(255,107,53,.07)'],
        'theme-ocean': ['#0a192f', '#00b4d8', '#90e0ef', 'rgba(0,180,216,.07)'],
        'theme-sneaker': ['#f3f4f6', '#111111', '#4a5568', 'rgba(0,0,0,.05)'],
        'theme-paper': ['#f4ebd9', '#4a3728', '#8c6a4f', 'rgba(74,55,40,.06)']
    };
    var t = 'theme-cyber';
    try { t = localStorage.getItem('theme') || 'theme-cyber'; } catch (e) {}
    var c = MAP[t] || MAP['theme-cyber'];
    var r = document.documentElement.style;
    r.setProperty('--lz-bg', c[0]);
    r.setProperty('--lz-fg', c[1]);
    r.setProperty('--lz-2', c[2]);
    r.setProperty('--lz-grid', c[3]);
})();
</script>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background-color: var(--lz-bg, #050507); color: var(--lz-fg, #a78bfa); font-family: 'Share Tech Mono', monospace; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; height: 100vh; overflow: hidden; padding: 40px; position: relative; }
    .grid-bg { position: absolute; inset: 0; z-index: -1; background-image: linear-gradient(var(--lz-grid, rgba(167,139,250,.07)) 1px, transparent 1px), linear-gradient(90deg, var(--lz-grid, rgba(167,139,250,.07)) 1px, transparent 1px); background-size: 40px 40px; transform: perspective(500px) rotateX(60deg) scale(2); opacity: 0.5; }
    .scanlines::after { content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); z-index: 2; background-size: 100% 2px, 3px 100%; pointer-events: none; }
    .terminal-window { width: 100%; max-width: 800px; z-index: 10; }
    .line { margin-bottom: 8px; font-size: 14px; opacity: 0; animation: fadeIn 0.1s forwards; text-shadow: 0 0 5px var(--lz-grid, rgba(167,139,250,.2)); }
    .highlight { color: #fff; }
    .warning { color: var(--lz-2, #ff69b4); text-shadow: none; }
    .cursor::after { content: '_'; animation: blink 1s step-end infinite; }
    .progress-container { margin-top: 30px; width: 300px; height: 4px; background: color-mix(in srgb, var(--lz-fg, #a78bfa) 22%, transparent); border-radius: 2px; overflow: hidden; }
    .progress-bar { width: 0%; height: 100%; background: var(--lz-fg, #a78bfa); box-shadow: 0 0 10px var(--lz-fg, #a78bfa); transition: width 0.1s linear; }
    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes blink { 50% { opacity: 0; } }
</style>
</head>
<body class="scanlines">
    <div class="grid-bg"></div>
    <div class="terminal-window" id="terminal"></div>
    <div class="progress-container">
        <div class="progress-bar" id="progress-bar"></div>
    </div>
<script>
    const lines = [
        { text: "SYSTEM_BOOT_SEQUENCE_INIT...", delay: 100 },
        { text: "Loading kernel modules...", delay: 300 },
        { text: "Mounting filesystem: /dev/sda1...", delay: 200 },
        { text: "Establishing secure connection...", delay: 400 },
        { text: "Verifying access credentials...", delay: 300 },
        { text: "Neural link established. <span class='highlight'>[OK]</span>", delay: 200 },
        { text: "WARNING: Bypassing security protocols...", delay: 300, class: "warning" },
        { text: "Redirecting to mainframe...", delay: 400 }
    ];
    const terminal = document.getElementById('terminal');
    const progressBar = document.getElementById('progress-bar');
    let currentLine = 0;
    let progress = 0;
    const progressInterval = setInterval(() => {
        progress += Math.random() * 15;
        if (progress >= 100) { progress = 100; clearInterval(progressInterval); }
        progressBar.style.width = progress + '%';
    }, 150);
    function printLine() {
        if (currentLine < lines.length) {
            const data = lines[currentLine];
            const div = document.createElement('div');
            div.className = 'line ' + (data.class || '');
            div.innerHTML = `> ${data.text} <span class="cursor"></span>`;
            const prevCursors = terminal.querySelectorAll('.cursor');
            prevCursors.forEach(c => c.remove());
            terminal.appendChild(div);
            currentLine++;
            setTimeout(printLine, data.delay);
        } else {
            setTimeout(() => {
                if (progress < 100) progressBar.style.width = '100%';
                setTimeout(() => { window.location.replace('load.html'); }, 300);
            }, 500);
        }
    }
    setTimeout(printLine, 300);
</script>
</body>
